<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulado – Direito Penal Militar (com feedback explicativo)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            padding: 30px 35px;
        }

        h1 {
            font-size: 28px;
            border-left: 6px solid #1e3c72;
            padding-left: 20px;
            color: #1e3c72;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
            font-size: 16px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 15px;
        }

        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 28px;
            border: none;
            background: #e9ecef;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: #2c3e50;
        }

        .tab-btn.active {
            background: #1e3c72;
            color: #fff;
            box-shadow: 0 4px 10px rgba(30, 60, 114, 0.3);
        }

        .tab-btn:hover:not(.active) {
            background: #d0d7e0;
        }

        .question-section {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .question-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0.4;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-card {
            background: #fafbfc;
            border-radius: 12px;
            padding: 18px 22px;
            margin-bottom: 16px;
            border: 1px solid #e9edf2;
            transition: border 0.2s;
        }

        .question-card:hover {
            border-color: #b0c4de;
        }

        .question-text {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 30px;
            padding-left: 8px;
            align-items: center;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
        }

        .options input[type="radio"] {
            width: 17px;
            height: 17px;
            accent-color: #1e3c72;
            cursor: pointer;
        }

        .true-false .options label {
            min-width: 80px;
        }

        .question-feedback {
            margin-top: 10px;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .question-feedback.correct {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .question-feedback.wrong {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .question-feedback.show {
            display: block;
        }

        .question-feedback .explanation {
            margin-top: 6px;
            font-weight: 400;
            font-size: 13.5px;
            color: #1e3c72;
            background: rgba(255, 255, 255, 0.5);
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 3px solid #1e3c72;
        }

        .btn-check-individual {
            background: #17a2b8;
            color: #fff;
            border: none;
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-left: 12px;
            white-space: nowrap;
        }

        .btn-check-individual:hover {
            background: #138496;
        }

        .btn-check-individual:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eef2f7;
        }

        .btn {
            padding: 10px 32px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            background: #e9ecef;
            color: #2c3e50;
        }

        .btn-primary {
            background: #1e3c72;
            color: #fff;
        }

        .btn-primary:hover {
            background: #16315a;
            box-shadow: 0 4px 12px rgba(30, 60, 114, 0.3);
        }

        .btn-success {
            background: #28a745;
            color: #fff;
        }

        .btn-success:hover {
            background: #1e7e34;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn-danger:hover {
            background: #bd2130;
        }

        .stats {
            font-size: 15px;
            background: #f8f9fa;
            padding: 6px 18px;
            border-radius: 30px;
            display: inline-block;
        }

        .result-box {
            background: #e8f0fe;
            border-radius: 12px;
            padding: 20px 25px;
            margin-top: 20px;
            border-left: 6px solid #1e3c72;
        }

        .result-box h3 {
            margin-top: 0;
            color: #1e3c72;
        }

        @media (max-width: 700px) {
            .container {
                padding: 18px;
            }
            .options {
                gap: 10px;
            }
            .tab-btn {
                padding: 8px 18px;
                font-size: 13px;
            }
            .btn-check-individual {
                margin-left: 0;
                margin-top: 8px;
                display: inline-block;
            }
            .flex-row {
                flex-wrap: wrap;
            }
        }

        .badge {
            background: #1e3c72;
            color: #fff;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 13px;
            margin-left: 8px;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚖️ Simulado – Direito Penal Militar</h1>
        <div class="subtitle">Foco nas aulas: CPM (Arts. 149–182, 187–194), Lei 13.491/2017, Lei 14.688/2023, IPM, CPPM e jurisprudência. <br> <strong>Clique em "Verificar" para ver a explicação da resposta.</strong></div>

        <!-- Abas -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="vf">Verdadeiro / Falso <span class="badge">30</span></button>
            <button class="tab-btn" data-tab="obj">Objetivas <span class="badge">20</span></button>
        </div>

        <!-- Seção V/F -->
        <div id="section-vf" class="question-section active">
            <div id="vf-questions"></div>
            <div class="action-bar">
                <div>
                    <button class="btn btn-success" id="check-vf">Corrigir todas</button>
                    <button class="btn btn-danger" id="reset-vf" style="margin-left:10px;">Limpar tudo</button>
                </div>
                <span class="stats" id="stats-vf">0 / 30 respondidas</span>
            </div>
            <div id="result-vf" class="result-box" style="display:none;"></div>
        </div>

        <!-- Seção Objetivas -->
        <div id="section-obj" class="question-section">
            <div id="obj-questions"></div>
            <div class="action-bar">
                <div>
                    <button class="btn btn-success" id="check-obj">Corrigir todas</button>
                    <button class="btn btn-danger" id="reset-obj" style="margin-left:10px;">Limpar tudo</button>
                </div>
                <span class="stats" id="stats-obj">0 / 20 respondidas</span>
            </div>
            <div id="result-obj" class="result-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------
        // 1. QUESTÕES V/F com explicação
        // ------------------------------------------------------------
        const vfQuestions = [
            { id: 1, text: 'O crime de motim (Art. 149) exige que os militares estejam armados para sua configuração; caso contrário, a conduta é atípica.', answer: false, explanation: 'O motim exige que os militares estejam DESARMADOS. Se estiverem armados, a conduta configura REVOLTA (Art. 149, parágrafo único), que é forma qualificada e mais grave.' },
            { id: 2, text: 'A revolta (Art. 149, parágrafo único) é uma forma qualificada do motim, punida com reclusão de 8 a 20 anos, e os "cabeças" têm a pena aumentada de 1/3.', answer: true, explanation: 'Correto. A revolta é o motim praticado por militares armados. A pena-base é de 8 a 20 anos de reclusão, com aumento de 1/3 para os líderes (cabeças).' },
            { id: 3, text: 'O militar que toma conhecimento da preparação de um motim e não comunica o superior comete o crime de omissão de lealdade militar (Art. 151), com pena de reclusão de 3 a 5 anos.', answer: true, explanation: 'Correto. O Art. 151 pune quem, tendo notícia da preparação de motim ou revolta, deixa de avisar o superior, ou, estando presente, não usa os meios para impedir.' },
            { id: 4, text: 'A violência contra superior (Art. 157) tem sua pena aumentada se o crime for cometido contra oficial de serviço, com emprego de arma, ou se resultar em lesão grave, mas não em morte.', answer: false, explanation: 'Se resultar em MORTE, a pena é de reclusão de 12 a 30 anos (Art. 157, § 2º). Portanto, a morte também é causa de aumento (na verdade, é uma hipótese de pena muito mais grave).' },
            { id: 5, text: 'O crime de despojamento desprezível (Art. 162) configura-se quando o militar se despoja de uniforme, condecoração ou insígnia por menosprezo, com aumento de metade da pena se praticado diante da tropa ou em público.', answer: true, explanation: 'Correto. O Art. 162 prevê detenção de 6 meses a 1 ano, com aumento de metade se praticado diante da tropa ou em público.' },
            { id: 6, text: 'A recusa de obediência (Art. 163) punível com detenção de 1 a 2 anos exige que a ordem descumprida seja sobre matéria de serviço ou dever militar, e que o agente seja militar da ativa.', answer: true, explanation: 'Correto. O tipo penal exige ordem sobre serviço ou dever militar, e o sujeito ativo é o militar (da ativa ou equiparado).' },
            { id: 7, text: 'A crítica indevida (Art. 166) consiste em criticar publicamente ato de superior, disciplina militar ou resolução do Governo, sendo punida com detenção de 6 meses a 1 ano.', answer: true, explanation: 'Correto. O Art. 166 pune a crítica pública a ato de superior, à disciplina militar ou a resolução do Governo, com detenção de 6 meses a 1 ano.' },
            { id: 8, text: 'O rigor excessivo (Art. 174) e a violência contra inferior (Art. 175) são crimes que só podem ser cometidos por oficiais contra praças, não se aplicando a relações entre militares de mesma patente.', answer: false, explanation: 'Os crimes são cometidos por superior contra inferior hierárquico, independentemente de ser oficial ou praça. Um sargento pode cometer contra um soldado, por exemplo.' },
            { id: 9, text: 'A ofensa aviltante (Art. 176) caracteriza-se pela violência moral ou física que, por sua natureza, seja considerada humilhante, sendo punida com detenção de 1 mês a 2 anos.', answer: true, explanation: 'Correto. O Art. 176 pune a violência moral ou física de natureza humilhante ou aviltante, com detenção de 1 mês a 2 anos.' },
            { id: 10, text: 'O crime de deserção (Art. 187) consuma-se no 8º dia de ausência injustificada, e o prazo de graça de 8 dias é contado a partir da zero hora do dia seguinte ao da constatação da falta (Art. 451 do CPPM).', answer: false, explanation: 'A deserção se consuma no 9º dia de ausência (após o 8º dia). O prazo de graça é de 8 dias, e a contagem se inicia à zero hora do dia seguinte à falta (Art. 451 do CPPM).' },
            { id: 11, text: 'A deserção especial (Art. 190) não admite prazo de graça, consumando-se no momento da partida do navio, aeronave ou deslocamento da tropa, sendo a pena agravada para oficiais.', answer: true, explanation: 'Correto. A deserção especial ocorre quando o militar deixa de se apresentar no momento da partida. Não há prazo de graça. A pena é aumentada em 1/3 para sargentos/subtenentes e 1/2 para oficiais.' },
            { id: 12, text: 'O concerto para deserção (Art. 191) exige a participação de pelo menos dois militares e, na modalidade complexa, a pena pode ser de reclusão.', answer: true, explanation: 'Correto. O concerto exige pluralidade de militares. Na modalidade simples é detenção; na complexa (se a deserção é efetivamente consumada), a pena é de reclusão.' },
            { id: 13, text: 'O favorecimento de desertor (Art. 193) prevê isenção de pena para ascendentes, descendentes, cônjuges e irmãos do desertor, conforme o parágrafo único do artigo.', answer: true, explanation: 'Correto. O parágrafo único do Art. 193 isenta de pena o ascendente, descendente, cônjuge ou irmão que favorece o desertor.' },
            { id: 14, text: 'A Lei nº 13.491/2017 ampliou a competência da Justiça Militar para incluir crimes previstos em leis especiais (ex.: Tortura, Lei de Drogas, Abuso de Autoridade) desde que praticados nas condições do Art. 9º, II do CPM.', answer: true, explanation: 'Correto. A Lei 13.491/2017 criou os "crimes militares por extensão", equiparando crimes da legislação comum quando praticados por militar em serviço, em lugar militar ou contra militar da ativa.' },
            { id: 15, text: 'De acordo com a Lei 13.491/2017, o crime de abuso de autoridade (Lei 13.869/2019) praticado por militar em serviço é considerado crime militar por extensão, sendo julgado pela Justiça Militar.', answer: true, explanation: 'Correto. O abuso de autoridade, quando praticado por militar em serviço ou em razão da função, enquadra-se como crime militar por extensão (Art. 9º, II, "c").' },
            { id: 16, text: 'A Súmula 53 do STJ estabelece que a Justiça Militar Estadual pode julgar civis em casos de crimes cometidos contra a administração militar, desde que haja previsão no CPM.', answer: false, explanation: 'A Súmula 53 do STJ veda o julgamento de civis pela Justiça Militar Estadual. Apenas a Justiça Militar da União pode julgar civis (Art. 9º, III do CPM).' },
            { id: 17, text: 'Os crimes dolosos contra a vida de civis praticados por policiais militares estaduais são de competência do Tribunal do Júri, conforme entendimento consolidado do STF e redação do Art. 9º, § 1º do CPM.', answer: true, explanation: 'Correto. O Art. 9º, § 1º do CPM (redação da Lei 13.491/2017) estabelece que os crimes dolosos contra a vida de civis são de competência do Tribunal do Júri.' },
            { id: 18, text: 'O princípio da insignificância é aplicável na Justiça Militar para crimes de posse de drogas em quartel, desde que a quantidade seja ínfima, conforme jurisprudência do STF.', answer: false, explanation: 'O STF e o STM entendem que a posse de drogas em quartel, por menor que seja, fere a disciplina e a segurança da tropa, sendo inaplicável o princípio da insignificância.' },
            { id: 19, text: 'A Lei nº 14.688/2023 extinguiu a figura do "assemelhado" no CPM (Art. 21) e reformulou o Art. 290, aumentando as penas para tráfico de drogas em área militar e prevendo punição para o militar que se apresenta sob efeito de entorpecentes em serviço.', answer: true, explanation: 'Correto. A Lei 14.688/2023 revogou o Art. 21 (assemelhado) e reformulou o Art. 290, com penas mais severas para tráfico e previsão de reclusão de até 4 anos para o militar sob efeito de drogas em serviço.' },
            { id: 20, text: 'A nova redação do Art. 232 do CPM, dada pela Lei 14.688/2023, incluiu expressamente o crime de estupro de vulnerável (§ 3º), para menores de 14 anos ou pessoas incapazes de resistência.', answer: true, explanation: 'Correto. A Lei 14.688/2023 modernizou o Art. 232, retirando expressões arcaicas e inserindo o estupro de vulnerável no § 3º.' },
            { id: 21, text: 'O IPM é um procedimento administrativo, sigiloso e inquisitorial, que não admite a participação de defensor técnico durante a fase investigativa, conforme o Art. 16 do CPPM.', answer: false, explanation: 'Embora o IPM seja sigiloso e inquisitorial, a Súmula Vinculante 14 do STF garante ao advogado o acesso aos elementos de prova já documentados. Além disso, o Art. 16-A do CPPM (Pacote Anticrime) assegura defesa técnica.' },
            { id: 22, text: 'No IPM, o prazo para conclusão quando o indiciado está preso é de 20 dias improrrogáveis, enquanto para o solto é de 40 dias, prorrogável por mais 20 dias.', answer: true, explanation: 'Correto. Art. 20 do CPPM: preso → 20 dias (improrrogável); solto → 40 dias + 20 (prorrogação).' },
            { id: 23, text: 'A autoridade militar que preside o IPM pode determinar o arquivamento dos autos se concluir pela inexistência de crime militar (Art. 24 do CPPM).', answer: false, explanation: 'O Art. 24 do CPPM proíbe a autoridade militar de arquivar o IPM. O arquivamento é ato exclusivo do Juiz, mediante requerimento do Ministério Público Militar.' },
            { id: 24, text: 'No Conselho de Justiça, o Juiz de Direito Militar (togado) vota em primeiro lugar, e os juízes militares votam do mais moderno ao mais antigo, cabendo ao Presidente (oficial mais antigo) o voto final.', answer: true, explanation: 'Correto. Art. 435 do CPPM: vota primeiro o Juiz de Direito, depois os oficiais do mais moderno ao mais antigo, e por último o Presidente.' },
            { id: 25, text: 'O Conselho de Justiça Especial é destinado ao julgamento de oficiais, sendo formado especificamente para cada processo, enquanto o Conselho Permanente julga praças e tem seus membros sorteados trimestralmente.', answer: true, explanation: 'Correto. O Conselho Especial julga oficiais e é formado para cada caso. O Permanente julga praças e tem composição trimestral.' },
            { id: 26, text: 'A inquirição de testemunhas no IPM deve observar a incomunicabilidade (Art. 353), sendo as testemunhas ouvidas separadamente para evitar contaminação de narrativas.', answer: true, explanation: 'Correto. O Art. 353 do CPPM determina que as testemunhas sejam inquiridas separadamente (regra "de per si").' },
            { id: 27, text: 'As testemunhas no processo penal militar são obrigadas a depor, mas os profissionais com sigilo de ofício (advogados, médicos, etc.) são proibidos de depor, salvo se a parte interessada desobrigar o sigilo e o depoente concordar.', answer: true, explanation: 'Correto. Art. 355 do CPPM: proibição absoluta para profissionais com sigilo, que só pode ser quebrada com a concordância do interessado e do depoente.' },
            { id: 28, text: 'O interrogatório do réu no CPPM, segundo a literalidade do Art. 302, é o último ato da instrução, mas o STF, no HC 127.900/AM, determinou que deve ser o primeiro ato, em homenagem à ampla defesa.', answer: false, explanation: 'O Art. 302 do CPPM prevê o interrogatório como o PRIMEIRO ato da instrução. O STF, no HC 127.900/AM, determinou que, por analogia ao CPP, deve ser o ÚLTIMO ato, para garantir a ampla defesa.' },
            { id: 29, text: 'Em caso de divergência entre o CPPM e tratados internacionais de direitos humanos ratificados pelo Brasil, prevalecem as normas do CPPM, por ser lei especial (Art. 1º, § 1º do CPPM).', answer: false, explanation: 'O Art. 1º, § 1º do CPPM estabelece exatamente o contrário: prevalecem as normas dos tratados internacionais em caso de divergência.' },
            { id: 30, text: 'O CPPM aplica-se subsidiariamente às leis penais especiais (como a Lei de Tortura e a Lei de Abuso de Autoridade) para suprir lacunas procedimentais, conforme o Art. 1º, § 2º do CPPM.', answer: true, explanation: 'Correto. O Art. 1º, § 2º do CPPM prevê a aplicação subsidiária do CPPM a processos regulados em leis especiais, quando omissas.' }
        ];

        // ------------------------------------------------------------
        // 2. QUESTÕES OBJETIVAS com explicação
        // ------------------------------------------------------------
        const objQuestions = [{
            id: 1,
            text: 'De acordo com o Código Penal Militar, o crime de motim (Art. 149) se caracteriza por:',
            options: [
                'Reunião de militares armados que se recusam a obedecer ordens.',
                'Reunião de militares desarmados agindo contra ordem, recusando obediência ou ocupando quartel.',
                'Ação individual de um militar que se recusa a cumprir ordem.',
                'Conjunto de militares que planejam a deserção.'
            ],
            correct: 1,
            explanation: 'O motim exige reunião de militares DESARMADOS. Se armados, é REVOLTA (Art. 149, parágrafo único). Ação individual é insubordinação, e planejar deserção é concerto para deserção (Art. 191).'
        }, {
            id: 2,
            text: 'A Lei nº 13.491/2017 introduziu no ordenamento militar a figura dos "crimes por extensão". Qual das alternativas abaixo NÃO se enquadra como crime militar por extensão?',
            options: [
                'Tortura (Lei 9.455/97) praticada por militar em serviço.',
                'Tráfico de drogas (Lei 11.343/06) em área militar.',
                'Furto de uso de viatura militar (Art. 241 do CPM).',
                'Abuso de autoridade (Lei 13.869/19) praticado por militar no exercício da função.'
            ],
            correct: 2,
            explanation: 'O furto de uso (Art. 241) é crime PROPRIAMENTE MILITAR, previsto no CPM. Os demais são crimes previstos em leis especiais que, nas condições do Art. 9º, II, tornam-se militares por extensão.'
        }, {
            id: 3,
            text: 'Sobre o Inquérito Policial Militar (IPM), assinale a alternativa correta:',
            options: [
                'O IPM é um procedimento judicial, sujeito ao contraditório pleno desde a sua instauração.',
                'O encarregado do IPM pode arquivar o inquérito se concluir pela atipicidade da conduta.',
                'O IPM é sigiloso, mas o advogado tem acesso aos elementos de prova já documentados (Súmula Vinculante 14).',
                'O prazo para conclusão do IPM com indiciado preso é de 40 dias, prorrogável por igual período.'
            ],
            correct: 2,
            explanation: 'O IPM é administrativo, sigiloso e inquisitorial. A Súmula Vinculante 14 garante acesso do advogado às provas documentadas. O prazo para preso é de 20 dias (não 40), e o arquivamento é vedado ao encarregado (Art. 24).'
        }, {
            id: 4,
            text: 'Qual a principal diferença entre o crime de deserção comum (Art. 187) e a deserção especial (Art. 190)?',
            options: [
                'A deserção especial exige que o militar esteja armado.',
                'A deserção comum não admite o retorno voluntário como atenuante.',
                'A deserção especial não possui prazo de graça de 8 dias, consumando-se no evento da partida.',
                'A deserção comum só se aplica a oficiais.'
            ],
            correct: 2,
            explanation: 'A deserção especial (Art. 190) ocorre quando o militar deixa de se apresentar no momento da partida do navio/aeronave ou deslocamento da tropa. Não há prazo de graça. A comum exige ausência > 8 dias.'
        }, {
            id: 5,
            text: 'De acordo com a Lei nº 14.688/2023, qual das seguintes alterações NÃO ocorreu no CPM?',
            options: [

        // ------------------------------------------------------------
        // 3. RENDERIZAÇÃO V/F com botão individual
        // ------------------------------------------------------------
        function renderVF() {
            const container = document.getElementById('vf-questions');
            let html = '';
            vfQuestions.forEach((q, idx) => {
                html += `
                    <div class="question-card true-false" data-qid="${q.id}">
                        <div class="question-text">${idx+1}. ${q.text}</div>
                        <div class="flex-row">
                            <div class="options">
                                <label><input type="radio" name="vf_${q.id}" value="true"> Verdadeiro</label>
                                <label><input type="radio" name="vf_${q.id}" value="false"> Falso</label>
                            </div>
                            <button class="btn-check-individual" data-qid="${q.id}" data-type="vf">Verificar</button>
                        </div>
                        <div class="question-feedback" id="vf-fb-${q.id}"></div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateStatsVF();
            attachIndividualCheck('vf');
            attachRadioListeners('vf');
        }

        // ------------------------------------------------------------
        // 4. RENDERIZAÇÃO OBJETIVAS
        // ------------------------------------------------------------
        function renderObj() {
            const container = document.getElementById('obj-questions');
            let html = '';
            objQuestions.forEach((q, idx) => {
                html += `
                    <div class="question-card" data-qid="${q.id}">
                        <div class="question-text">${idx+1}. ${q.text}</div>
                        <div class="flex-row">
                            <div class="options">
                                ${q.options.map((opt, oi) => `
                                    <label><input type="radio" name="obj_${q.id}" value="${oi}"> ${String.fromCharCode(65+oi)}) ${opt}</label>
                                `).join('')}
                            </div>
                            <button class="btn-check-individual" data-qid="${q.id}" data-type="obj">Verificar</button>
                        </div>
                        <div class="question-feedback" id="obj-fb-${q.id}"></div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateStatsObj();
            attachIndividualCheck('obj');
            attachRadioListeners('obj');
        }

        // ------------------------------------------------------------
        // 5. VERIFICAÇÃO INDIVIDUAL com explicação
        // ------------------------------------------------------------
        function attachIndividualCheck(type) {
            const buttons = document.querySelectorAll(`#section-${type === 'vf' ? 'vf' : 'obj'} .btn-check-individual`);
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const qid = parseInt(this.dataset.qid);
                    if (type === 'vf') {
                        checkIndividualVF(qid);
                    } else {
                        checkIndividualObj(qid);
                    }
                });
            });
        }

        function checkIndividualVF(qid) {
            const question = vfQuestions.find(q => q.id === qid);
            const selected = document.querySelector(`input[name="vf_${qid}"]:checked`);
            const fb = document.getElementById(`vf-fb-${qid}`);
            if (!selected) {
                fb.className = 'question-feedback show wrong';
                fb.innerHTML = '⚠️ Selecione uma opção antes de verificar.';
                return;
            }
            const isCorrect = (selected.value === 'true') === question.answer;
            fb.className = `question-feedback show ${isCorrect ? 'correct' : 'wrong'}`;
            const status = isCorrect ? '✅ Correto!' : '❌ Incorreto.';
            fb.innerHTML = `${status}<div class="explanation">📘 ${question.explanation}</div>`;
            updateStatsVF();
        }

        function checkIndividualObj(qid) {
            const question = objQuestions.find(q => q.id === qid);
            const selected = document.querySelector(`input[name="obj_${qid}"]:checked`);
            const fb = document.getElementById(`obj-fb-${qid}`);
            if (!selected) {
                fb.className = 'question-feedback show wrong';
                fb.innerHTML = '⚠️ Selecione uma opção antes de verificar.';
                return;
            }
            const isCorrect = parseInt(selected.value) === question.correct;
            fb.className = `question-feedback show ${isCorrect ? 'correct' : 'wrong'}`;
            const correctLetter = String.fromCharCode(65 + question.correct);
            const status = isCorrect ? '✅ Correto!' : `❌ Incorreto. Resposta correta: ${correctLetter}) ${question.options[question.correct]}`;
            fb.innerHTML = `${status}<div class="explanation">📘 ${question.explanation}</div>`;
            updateStatsObj();
        }

        // ------------------------------------------------------------
        // 6. ESTATÍSTICAS
        // ------------------------------------------------------------
        function updateStatsVF() {
            const total = vfQuestions.length;
            let answered = 0;
            vfQuestions.forEach(q => {
                const radios = document.querySelectorAll(`input[name="vf_${q.id}"]:checked`);
                if (radios.length > 0) answered++;
            });
            document.getElementById('stats-vf').textContent = `${answered} / ${total} respondidas`;
        }

        function updateStatsObj() {
            const total = objQuestions.length;
            let answered = 0;
            objQuestions.forEach(q => {
                const radios = document.querySelectorAll(`input[name="obj_${q.id}"]:checked`);
                if (radios.length > 0) answered++;
            });
            document.getElementById('stats-obj').textContent = `${answered} / ${total} respondidas`;
        }

        function attachRadioListeners(type) {
            const container = type === 'vf' ? 'section-vf' : 'section-obj';
            const inputs = document.querySelectorAll(`#${container} input[type="radio"]`);
            inputs.forEach(inp => {
                inp.addEventListener('change', () => {
                    if (type === 'vf') updateStatsVF();
                    else updateStatsObj();
                });
            });
        }

        // ------------------------------------------------------------
        // 7. CORREÇÃO EM MASSA V/F
        // ------------------------------------------------------------
        function corrigirVF() {
            let acertos = 0;
            let total = vfQuestions.length;
            let todasRespondidas = true;

            vfQuestions.forEach(q => {
                const selected = document.querySelector(`input[name="vf_${q.id}"]:checked`);
                const fb = document.getElementById(`vf-fb-${q.id}`);
                if (!selected) {
                    todasRespondidas = false;
                    fb.className = 'question-feedback show wrong';
                    fb.innerHTML = '⚠️ Não respondida.';
                    return;
                }
                const isCorrect = (selected.value === 'true') === q.answer;
                if (isCorrect) acertos++;
                fb.className = `question-feedback show ${isCorrect ? 'correct' : 'wrong'}`;
                const status = isCorrect ? '✅ Correto!' : '❌ Incorreto.';
                fb.innerHTML = `${status}<div class="explanation">📘 ${q.explanation}</div>`;
            });

            const resultDiv = document.getElementById('result-vf');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>Resultado – V/F</h3>
                <p><strong>${acertos}</strong> acertos de <strong>${total}</strong> questões.</p>
                <p>${!todasRespondidas ? '⚠️ Algumas questões não foram respondidas.' : '✅ Todas as questões foram respondidas.'}</p>
                <p style="font-size:14px; color:#555;">Percentual: ${Math.round((acertos/total)*100)}%</p>
            `;
        }

        // ------------------------------------------------------------
        // 8. CORREÇÃO EM MASSA OBJETIVAS
        // ------------------------------------------------------------
        function corrigirObj() {
            let acertos = 0;
            let total = objQuestions.length;
            let todasRespondidas = true;

            objQuestions.forEach(q => {
                const selected = document.querySelector(`input[name="obj_${q.id}"]:checked`);
                const fb = document.getElementById(`obj-fb-${q.id}`);
                if (!selected) {
                    todasRespondidas = false;
                    fb.className = 'question-feedback show wrong';
                    fb.innerHTML = '⚠️ Não respondida.';
                    return;
                }
                const isCorrect = parseInt(selected.value) === q.correct;
                if (isCorrect) acertos++;
                fb.className = `question-feedback show ${isCorrect ? 'correct' : 'wrong'}`;
                const correctLetter = String.fromCharCode(65 + q.correct);
                const status = isCorrect ? '✅ Correto!' : `❌ Incorreto. Resposta correta: ${correctLetter}) ${q.options[q.correct]}`;
                fb.innerHTML = `${status}<div class="explanation">📘 ${q.explanation}</div>`;
            });

            const resultDiv = document.getElementById('result-obj');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>Resultado – Objetivas</h3>
                <p><strong>${acertos}</strong> acertos de <strong>${total}</strong> questões.</p>
                <p>${!todasRespondidas ? '⚠️ Algumas questões não foram respondidas.' : '✅ Todas as questões foram respondidas.'}</p>
                <p style="font-size:14px; color:#555;">Percentual: ${Math.round((acertos/total)*100)}%</p>
            `;
        }

        // ------------------------------------------------------------
        // 9. RESET
        // ------------------------------------------------------------
        function resetVF() {
            document.querySelectorAll('#section-vf input[type="radio"]').forEach(inp => inp.checked = false);
            document.querySelectorAll('#section-vf .question-feedback').forEach(el => {
                el.className = 'question-feedback';
                el.innerHTML = '';
            });
            document.getElementById('result-vf').style.display = 'none';
            updateStatsVF();
        }

        function resetObj() {
            document.querySelectorAll('#section-obj input[type="radio"]').forEach(inp => inp.checked = false);
            document.querySelectorAll('#section-obj .question-feedback').forEach(el => {
                el.className = 'question-feedback';
                el.innerHTML = '';
            });
            document.getElementById('result-obj').style.display = 'none';
            updateStatsObj();
        }

        // ------------------------------------------------------------
        // 10. ABAS
        // ------------------------------------------------------------
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('.question-section').forEach(sec => sec.classList.remove('active'));
                if (tab === 'vf') document.getElementById('section-vf').classList.add('active');
                else document.getElementById('section-obj').classList.add('active');
            });
        });

        // ------------------------------------------------------------
        // 11. EVENTOS DOS BOTÕES EM MASSA
        // ------------------------------------------------------------
        document.getElementById('check-vf').addEventListener('click', corrigirVF);
        document.getElementById('reset-vf').addEventListener('click', resetVF);
        document.getElementById('check-obj').addEventListener('click', corrigirObj);
        document.getElementById('reset-obj').addEventListener('click', resetObj);

        // ------------------------------------------------------------
        // 12. INICIALIZAÇÃO
        // ------------------------------------------------------------
        renderVF();
        renderObj();
    </script>
</body>
</html>
