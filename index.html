                    'O Encarregado do IPM pode mandar arquivar os autos se constatar inocência inequívoca.',
                    'O Comandante da Unidade tem o poder discricionário de arquivar o IPM.',
                    'O arquivamento só pode ser determinado pela Autoridade Judiciária competente, a requerimento do Ministério Público Militar.',
                    'O encarregado deve propor o arquivamento diretamente à Corregedoria.'
                ],
                correct: 2,
                explanation: 'Arts. 24 e 25, CPPM: Princípio da Indisponibilidade do Inquérito. A autoridade policial militar não pode arquivar IPM; o arquivamento é ato exclusivo do Juiz a requerimento do MPM.'
            },
            {
                id: 20,
                text: 'Nos termos do Art. 16 do CPPM, no que diz respeito à contagem dos prazos referentes à constrição da liberdade de locomoção e aos atos processuais/investigativos:',
                options: [
                    'Exclui-se o dia do início e inclui-se o dia do vencimento em todas as hipóteses.',
                    'O prazo do IPM de réu preso conta-se do dia em que se executar a ordem de prisão, incluindo-se o dia do início.',
                    'Os prazos são contados apenas em dias úteis durante o período de instrução.',
                    'A contagem dos prazos é suspensa nos finais de semana e feriados em qualquer circunstância.'
                ],
                correct: 1,
                explanation: 'Art. 16, CPPM / Regras Próprias do Direito Penal Militar: No prazo do IPM de réu preso, inclui-se o dia do início por afetar a liberdade individual do indiciado.'
            }
        ];

        // ------------------------------------------------------------
        // RENDERIZAÇÃO DAS QUESTÕES OBJETIVAS
        // ------------------------------------------------------------
        function renderObj() {
            const container = document.getElementById('obj-questions');
            let html = '';

            // Parte 1
            html += `<div class="section-title">📘 Parte 1 – Direito Penal e Processual Penal Militar</div>`;
            for (let i = 0; i < 10; i++) {
                const q = objQuestions[i];
                html += buildQuestionCard(i, q);
            }

            // Parte 2
            html += `<div class="section-title">📘 Parte 2 – Inquérito Policial Militar (IPM) e CPPM</div>`;
            for (let i = 10; i < 20; i++) {
                const q = objQuestions[i];
                html += buildQuestionCard(i, q);
            }

            container.innerHTML = html;
            updateStatsObj();
            attachIndividualCheck();
            attachRadioListeners();
        }

        function buildQuestionCard(index, q) {
            const letter = String.fromCharCode(65 + index);
            return `
                <div class="question-card" data-qid="${q.id}">
                    <div class="question-text">
                        <span class="question-number">${index+1}.</span> ${q.text}
                    </div>
                    <div class="flex-row">
                        <div class="options">
                            ${q.options.map((opt, oi) => `
                                <label><input type="radio" name="obj_${q.id}" value="${oi}"> ${String.fromCharCode(65+oi)}) ${opt}</label>
                            `).join('')}
                        </div>
                        <button class="btn-check-individual" data-qid="${q.id}">Verificar</button>
                    </div>
                    <div class="question-feedback" id="obj-fb-${q.id}"></div>
                </div>
            `;
        }

        // ------------------------------------------------------------
        // VERIFICAÇÃO INDIVIDUAL
        // ------------------------------------------------------------
        function attachIndividualCheck() {
            const buttons = document.querySelectorAll('.btn-check-individual');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const qid = parseInt(this.dataset.qid);
                    checkIndividualObj(qid);
                });
            });
        }

        function checkIndividualObj(qid) {
            const question = objQuestions.find(q => q.id === qid);
            if (!question) return;
            const selected = document.querySelector(`input[name="obj_${qid}"]:checked`);
            const fb = document.getElementById(`obj-fb-${qid}`);
            if (!selected) {
                fb.className = 'question-feedback show wrong';
                fb.innerHTML = '⚠️ Selecione uma opção antes de verificar.';
                return;
            }
            const isCorrect = parseInt(selected.value) === question.correct;
            fb.className = `question-feedback show ${isCorrect ? 'correct' : 'wrong'}`;
            const correctLetter = String.fromCharCode(65 + question.correct);
            const status = isCorrect ? '✅ Correto!' : `❌ Incorreto. Resposta correta: ${correctLetter}) ${question.options[question.correct]}`;
            fb.innerHTML = `${status}<div class="explanation">📘 ${question.explanation}</div>`;
            updateStatsObj();
        }

        // ------------------------------------------------------------
        // ESTATÍSTICAS
        // ------------------------------------------------------------
        function updateStatsObj() {
            const total = objQuestions.length;
            let answered = 0;
            objQuestions.forEach(q => {
                const radios = document.querySelectorAll(`input[name="obj_${q.id}"]:checked`);
                if (radios.length > 0) answered++;
            });
            document.getElementById('stats-obj').textContent = `${answered} / ${total} respondidas`;
        }

        function attachRadioListeners() {
            const inputs = document.querySelectorAll('#section-obj input[type="radio"]');
            inputs.forEach(inp => {
                inp.addEventListener('change', updateStatsObj);
            });
        }

        // ------------------------------------------------------------
        // CORREÇÃO EM MASSA
        // ------------------------------------------------------------
        function corrigirObj() {
            let acertos = 0;
            let total = objQuestions.length;
            let todasRespondidas = true;

            objQuestions.forEach(q => {
                const selected = document.querySelector(`input[name="obj_${q.id}"]:checked`);
                const fb = document.getElementById(`obj-fb-${q.id}`);
                if (!selected) {
                    todasRespondidas = false;
                    fb.className = 'question-feedback show wrong';
                    fb.innerHTML = '⚠️ Não respondida.';
                    return;
                }
                const isCorrect = parseInt(selected.value) === q.correct;
                if (isCorrect) acertos++;
                fb.className = `question-feedback show ${isCorrect ? 'correct' : 'wrong'}`;
                const correctLetter = String.fromCharCode(65 + q.correct);
                const status = isCorrect ? '✅ Correto!' : `❌ Incorreto. Resposta correta: ${correctLetter}) ${q.options[q.correct]}`;
                fb.innerHTML = `${status}<div class="explanation">📘 ${q.explanation}</div>`;
            });

            const resultDiv = document.getElementById('result-obj');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>📊 Resultado – Geral</h3>
                <p><strong>${acertos}</strong> acertos de <strong>${total}</strong> questões.</p>
                <p>${!todasRespondidas ? '⚠️ Algumas questões não foram respondidas.' : '✅ Todas as questões foram respondidas.'}</p>
                <p style="font-size:14px; color:#555;">Percentual de acerto: ${Math.round((acertos/total)*100)}%</p>
            `;
        }

        // ------------------------------------------------------------
        // RESET
        // ------------------------------------------------------------
        function resetObj() {
            document.querySelectorAll('#section-obj input[type="radio"]').forEach(inp => inp.checked = false);
            document.querySelectorAll('#section-obj .question-feedback').forEach(el => {
                el.className = 'question-feedback';
                el.innerHTML = '';
            });
            document.getElementById('result-obj').style.display = 'none';
            updateStatsObj();
        }

        // ------------------------------------------------------------
        // EVENTOS DOS BOTÕES
        // ------------------------------------------------------------
        document.getElementById('check-obj').addEventListener('click', corrigirObj);
        document.getElementById('reset-obj').addEventListener('click', resetObj);

        // ------------------------------------------------------------
        // INICIALIZAÇÃO
        // ------------------------------------------------------------
        renderObj();
    </script>
</body>
</html>
